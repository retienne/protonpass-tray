<?xml version="1.0" encoding="UTF-8"?>
<!-- An overlay badge, not a glyph: it is drawn over the bottom-right corner of an application
     icon, so on a 22px panel it is about 15px across. A black padlock in a white outline, with
     no disc behind it: the outline is what reads on a dark panel and the black on a light one,
     and everything else stays transparent. Closed and open differ by the shackle alone, so the
     shackle takes half the height. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <g fill="#ffffff" stroke="#ffffff" stroke-linejoin="round">
    <path d="M9 11V7a4 4 0 0 1 8 0v4z" stroke-width="6"/>
    <rect x="6" y="10" width="14" height="10" rx="1.4" stroke-width="4"/>
  </g>
  <path d="M9 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="#000000" stroke-width="2.4"/>
  <rect x="6" y="10" width="14" height="10" rx="1.4" fill="#000000"/>
</svg>
